name: Node.js CI/CD Pipeline

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  # --- GIAI ĐOẠN 1: KIỂM TRA LỖI BUILD TRƯỚC KHI DEPLOY ---
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Đã cập nhật lên Node 24
          cache: 'npm'

      - name: Install dependencies and Build
        run: |
          npm install --production=false
          npm run build

  # --- GIAI ĐOẠN 2: TỰ ĐỘNG KÉO CODE VÀ DEPLOY LÊN VPS ---
  deploy:
    needs: build # Chỉ deploy khi code build không có lỗi
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /var/www/backend
            # Kéo code mới nhất từ nhánh main
            git pull origin main

            # Cài đặt các thư viện mới (nếu có) và Build lại
            npm install --production=false
            npm run build

            # Khởi động lại ứng dụng
            pm2 restart momentu-backend
