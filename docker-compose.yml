version: '3.9'

services:
  # ============================================
  # PostgreSQL Database Service
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: moment_u_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-moment_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: Init script nếu có
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moment_network
    restart: unless-stopped

  # ============================================
  # Redis Service (Caching & Job Queue)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: moment_u_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moment_network
    restart: unless-stopped

  # ============================================
  # NestJS Backend Application
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moment_u_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-moment_db}?schema=public
      DIRECT_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-moment_db}

      # Server
      PORT: ${PORT:-8001}
      NODE_ENV: ${NODE_ENV:-development}

      # JWT
      JWT_SECRET: ${JWT_SECRET}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}

      # External Services
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      # Mail Service
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_MAIL_PASS: ${GOOGLE_MAIL_PASS}

      # Admin
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY}

      # API Base URL
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8001}
    ports:
      - '${PORT:-8001}:8001'
    networks:
      - moment_network
    restart: unless-stopped
    # Logging
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  moment_network:
    driver: bridge
