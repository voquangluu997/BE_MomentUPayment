# ============================================
# Production Docker Compose with Nginx & Certbot
# ============================================
# Usage: docker-compose -f docker-compose.full-stack.yml up -d
#
# This includes:
# - NestJS Backend
# - PostgreSQL (optional - use external service in production)
# - Redis (optional - use external service in production)
# - Nginx (Reverse Proxy & SSL)
# - Certbot (SSL Certificate Management)
# ============================================

version: '3.9'

services:
  # ============================================
  # PostgreSQL Database (Optional for prod)
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: moment_u_postgres_prod
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-moment_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moment_network
    restart: unless-stopped
    # Only expose to backend, not to host
    expose:
      - '5432'

  # ============================================
  # Redis Service (Optional for prod)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: moment_u_redis_prod
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moment_network
    restart: unless-stopped
    expose:
      - '6379'

  # ============================================
  # NestJS Backend Application
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moment_u_backend_prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}

      # Server
      PORT: 8001
      NODE_ENV: production

      # JWT
      JWT_SECRET: ${JWT_SECRET}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # External Services
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      # Mail
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}

      # Google
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_MAIL_PASS: ${GOOGLE_MAIL_PASS}

      # Admin
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY}

      # API Base URL
      API_BASE_URL: ${API_BASE_URL}

    networks:
      - moment_network

    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://localhost:8001/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Only expose to nginx, not to host
    expose:
      - '8001'

  # ============================================
  # Nginx Reverse Proxy
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: moment_u_nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./www/certbot:/var/www/certbot:ro
      - nginx_cache:/var/cache/nginx
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
    networks:
      - moment_network
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://localhost/health',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

  # ============================================
  # Certbot for Let's Encrypt SSL
  # ============================================
  certbot:
    image: certbot/certbot:latest
    container_name: moment_u_certbot
    volumes:
      - ./ssl:/etc/letsencrypt:rw
      - ./www/certbot:/var/www/certbot:rw
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'
    networks:
      - moment_network
    restart: unless-stopped
    profiles:
      - ssl # Only run with: docker-compose --profile ssl up

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  nginx_cache:
    driver: local

networks:
  moment_network:
    driver: bridge

# ============================================
# QUICK START COMMANDS
# ============================================
# 1. Build images:
#    docker-compose -f docker-compose.full-stack.yml build
#
# 2. Start all services:
#    docker-compose -f docker-compose.full-stack.yml up -d
#
# 3. Run database migrations:
#    docker-compose -f docker-compose.full-stack.yml exec backend npm run migrate:deploy
#
# 4. View logs:
#    docker-compose -f docker-compose.full-stack.yml logs -f backend
#
# 5. Get SSL certificate (first time):
#    docker-compose -f docker-compose.full-stack.yml --profile ssl run --rm certbot \
#      certonly --webroot --webroot-path /var/www/certbot \
#      -d yourdomain.com -d www.yourdomain.com \
#      --email admin@yourdomain.com --agree-tos --no-eff-email
#
# 6. Stop all services:
#    docker-compose -f docker-compose.full-stack.yml down
#
# 7. Remove all data (WARNING):
#    docker-compose -f docker-compose.full-stack.yml down -v
# ============================================
